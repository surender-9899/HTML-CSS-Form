<HTML>
    <head>
        <title> Surender's HTML FORM </title>
        <link rel="stylesheet" href="Style.css">

    </head>
    <body><div><h3> User Registration  </h3></div>
        
        <div>
        <form  class = "registration-form" id="myForm">
            <!-- <h5 style="text-shadow: 9px 9px 9px rgba(0, 0, 0, 0.3);  font-size: 25px; font: bold; "> Registration Form </h5> -->

            <div class = "form-group" >
                <label for= "FirstName"> First Name: <span style="color: rgba(213, 4, 4, 0.907);">*</span></label>
                <input type ="text" id= "FirstName" name= "FirstName" placeholder="Enter Fast Name"">
                <span style="color: red; display: none; font-size: 10px;"></span> <br><br>
            </div>

            <div class = "form-group">
                <label for= "LastName"> Last Name: </label>
                <input type= "text" id= "LastName" name="LastName" placeholder=" Enter Last Name">
                <span style="color: red; display: none; font-size: 10px;"></span><br><br>
            </div>

            <div class = "form-group">
                <label for="Number"> Number: <span style="color: rgba(213, 4, 4, 0.907);">*</span></label>
                <input type="tel" id = "Number" name = "Number" placeholder="Enter Phone Number" >
                <span style="color: red; display: none; font-size: 10px;"></span> <br><br>
            </div>

             <div class = "form-group">
                <label for= "D.O.B"> D.O.B <span style="color: rgba(213, 4, 4, 0.907);">*</span></label>
                <input type= "date" id= "D.O.B" name= "D.O.B">
                <span style="color: red; display: none; font-size: 10px; "></span> <br><br>
            </div>

            <div class = "form-email">
                <label for= "Email"> Email:<span style="color: rgba(213, 4, 4, 0.907);">*</span>  </label>
                <input type= "email" id="Email" name="Email" placeholder="Enter Email" >
                <span style="color: red; display: none; font-size: 10px;"></span> <br><br>
            </div>

            <div class = "form-group">
                <label for= "Password"> Password: <span style="color: rgba(213, 4, 4, 0.907);">*</span></label>
                <input type= "password" id="Password" name="Password" placeholder="Enter Password">
                <span style="color: red; display: none; font-size: 10px;"></span><br><br>
            </div>

            <div class = "form-group">
                 <label for="ConfirmPassword">Confirm Password:<span style="color: rgba(213, 4, 4, 0.907);">*</span></label>
                <input type= "password" id="ConfirmPassword" name="ConfirmPassword" placeholder="Confirm Password">
                <span style="color: red; display: none; font-size: 10px;"></span><br><br>
            </div>

            <div class = "form-address">
                <label for= "Address Line 1"> Address Line 1: 
                    <span style="color: rgba(213, 4, 4, 0.907);">*</span>
                </label>
                <input type= "text" id= "Address Line 1" name= "Address Line 1" placeholder="Enter Address">
                <span style="color: red; display: none; font-size: 10px;"></span><br><br>
            </div>
            
             <div class = "form-address">
                <label for= "Address Line 2"> Address Line 2:</label>
                <input type= "text" id= "Address Line 2" name= "Address Line 2" placeholder="Enter Address">
                <span style="color: red; display: none; font-size: 10px;"></span><br><br>
            </div>
           
            <div>
                <label >Gender <span style="color: rgba(213, 4, 4, 0.907);">*</span></label><br>
                <input type="radio" id="male" name="Gender" value="Male" >
                <label for="male">Male</label><br>
                <input type="radio" id="female" name="Gender" value="Female" >
                <label for="female">Female</label><br>
                <input type="radio" id="other" name="Gender" value="Other" >
                <label for="other">Other</label><br>
                <span style="color: red; display: none; font-size: 10px;"></span> <br><br>
            </div>

        
            <div class="form-terms">
                <input type="checkbox" id="terms">
                <label for="terms">I accept the terms.<span style="color: rgba(213, 4, 4, 0.907);">*</span></label>
            </div>

            <div class = "button-group">
                <button type="reset">Reset</button>
                <button type ="submit">Sign up</button>
            </div>

            
        </form>
        </div>

        <div class = "result" id = "result"></div>
        <h6 style="text-shadow: 9px 9px 9px rgba(0, 0, 0, 0.3);  font-size: 25px; margin-bottom: 0px; margin-left: 20px; ">Submitted Form Information: </h6><br>
        <p class="form-HtmlDisplay" id="displayData" style = "padding: 20px; "></p> 
        <script src="intex.js"></script>

    </body>
</HTML>
